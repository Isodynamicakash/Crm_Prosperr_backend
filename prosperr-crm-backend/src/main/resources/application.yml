spring:
  application:
    name: prosperr-crm
  # Local secrets (SARVAM_API_KEY, ...) can live in a git-ignored .env next to pom.xml.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=crm}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: crm
        jdbc:
          time_zone: UTC
  flyway:
    schemas: crm
    default-schema: crm
    locations: classpath:db/migration
    placeholder-replacement: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${PORT:8080}
  error:
    include-message: always

crm:
  auth:
    jwt-secret: ${JWT_SECRET:change-me-in-production-to-a-long-random-secret-0123456789}
    token-ttl: ${TOKEN_TTL:12h}
    google-client-id: ${GOOGLE_CLIENT_ID:set-your-google-oauth-client-id}
    dev-login-enabled: ${DEV_LOGIN_ENABLED:false}
  app:
    base-url: ${APP_BASE_URL:http://localhost:8080}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jobs:
    enabled: ${JOBS_ENABLED:true}
  mail:
    provider: ${MAIL_PROVIDER:log}
  google:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:${APP_BASE_URL:http://localhost:8080}/api/integrations/google/callback}
    encryption-key: ${ENCRYPTION_KEY:}
    # Calendar invites go to the team only unless this is true; then client stakeholders get the invite too.
    invite-clients: ${GOOGLE_CALENDAR_INVITE_CLIENTS:false}
  ai:
    sarvam-api-key: ${SARVAM_API_KEY:}
    sarvam-base-url: ${SARVAM_BASE_URL:https://api.sarvam.ai}
    stt-model: ${SARVAM_STT_MODEL:saaras:v3}
    chat-model: ${SARVAM_CHAT_MODEL:sarvam-105b}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info